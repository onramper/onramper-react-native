name: Release

on:
  workflow_dispatch:
    inputs:
      ios-version:
        description: 'iOS SDK release tag to bundle (e.g. 1.0.0)'
        required: true
      prerelease:
        description: 'Pre-release suffix for wrapper-only patches (blank for normal release)'
        required: false
        default: ''

jobs:
  release:
    runs-on: macos-15
    permissions:
      # contents: write — the job pushes the release commit/tag and creates a
      # GitHub release. id-token: write — lets npm authenticate via trusted
      # publishing (OIDC) and mint the Sigstore identity for provenance.
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # `npm stage publish` over trusted publishing needs npm >= 11.15.0.
      # Pinned exactly: this job can mint an OIDC publish token.
      - name: Upgrade npm
        run: npm install -g npm@11.21.0

      - name: Verify iOS release exists
        env:
          IOS_VERSION: ${{ github.event.inputs.ios-version }}
        run: |
          set -e
          curl -fsSIL -o /dev/null \
            "https://github.com/onramper/onramper-ios/releases/download/v${IOS_VERSION}/OnramperSDK.xcframework.zip" \
            || { echo "No iOS release for v${IOS_VERSION}"; exit 1; }

      - name: Compute target version
        id: ver
        env:
          BASE: ${{ github.event.inputs.ios-version }}
          PR: ${{ github.event.inputs.prerelease }}
        run: |
          if [ -z "$PR" ]; then
            echo "version=${BASE}" >> "$GITHUB_OUTPUT"
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "version=${BASE}-${PR}" >> "$GITHUB_OUTPUT"
            echo "tag=next" >> "$GITHUB_OUTPUT"
          fi

      - name: Refuse if already published
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if npm view "@onramper/onramper-react-native@${VERSION}" version 2>/dev/null; then
            echo "Version ${VERSION} already on npm."; exit 1
          fi

      - name: Validate SDK pin + bump package.json
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          IOS_VERSION: ${{ github.event.inputs.ios-version }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const baseVersion = typeof p.version === 'string' ? p.version.split('-')[0] : '';
          const checksum = p.onramperSDK?.checksum;

          if (baseVersion !== process.env.IOS_VERSION) {
            console.error(`package.json base version ${baseVersion || '(missing)'} does not match iOS version ${process.env.IOS_VERSION}.`);
            process.exit(1);
          }
          if (typeof checksum !== 'string' || !/^[0-9a-f]{64}$/.test(checksum)) {
            console.error('package.json onramperSDK.checksum must be exactly 64 lowercase hexadecimal characters.');
            process.exit(1);
          }

          p.version = process.env.VERSION;
          fs.writeFileSync('package.json', `${JSON.stringify(p, null, 2)}\n`);
          NODE

      - name: Prepare release notes
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const heading = `## [${process.env.VERSION}]`;
          const sections = changelog.split(/^## /m).slice(1);
          const section = sections.find(value => `## ${value.split('\n')[0]}` === heading);
          if (!section) throw new Error(`Missing changelog entry for ${process.env.VERSION}`);
          const notes = section.slice(section.indexOf('\n') + 1).trim();
          if (!notes) throw new Error(`Empty changelog entry for ${process.env.VERSION}`);
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/release-notes.md`, `${notes}\n`);
          NODE

      - name: Fetch xcframework + checksum
        run: npm ci && npm run fetch-xcframework

      - name: Verify checksum recorded
        run: npm run verify-version

      - name: Slim xcframework for npm
        run: npm run slim-xcframework

      - name: Test + build
        run: |
          npm run lint
          npm run typecheck
          npx jest
          npm run test:native
          npm run build

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit + tag
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          git add package.json
          # package.json may already be at the target version/checksum (e.g. it
          # was pre-populated on master), in which case there is nothing to
          # commit — that's fine. The tag is what the publish + podspec git
          # source need, so always create and push it.
          if git diff --cached --quiet; then
            echo "package.json already at v${VERSION} with recorded checksum; nothing to commit."
          else
            git commit -m "chore(release): v${VERSION}"
            git push origin master
          fi
          # Idempotent: a prior run that failed at publish may have already
          # created/pushed the tag. Skip if it exists (HEAD is unchanged in the
          # nothing-to-commit path, so the existing tag is correct).
          if git ls-remote --exit-code --tags origin "v${VERSION}" >/dev/null 2>&1; then
            echo "tag v${VERSION} already exists on origin; skipping."
          else
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
          fi

      # Authenticates via trusted publishing (OIDC) — no npm token. The version
      # is staged, not live: a maintainer must approve it with 2FA on
      # npmjs.com (Staged Packages tab) or via `npm stage approve <stage-id>`.
      # The dist-tag is fixed at staging time and cannot be changed on approval.
      - name: Stage npm publish
        env:
          NPM_TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -o pipefail
          npm stage publish --tag "$NPM_TAG" --access public 2>&1 | tee stage-publish.log
          STAGE_ID=$(grep -oE 'staged with id [0-9a-fA-F-]+' stage-publish.log | awk '{print $4}' || true)
          {
            echo "### npm v${VERSION} staged (tag: ${NPM_TAG})"
            echo
            echo "Not live until a maintainer approves it with 2FA:"
            echo "- npmjs.com → @onramper/onramper-react-native → Staged Packages → Approve"
            echo "- or locally: \`npm stage approve ${STAGE_ID:-<stage-id>}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
